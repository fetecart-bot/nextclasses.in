<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="claude-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0f0c0b"/>
    </linearGradient>

    <!-- Warm Anthropic Terracotta Glow -->
    <radialGradient id="terracotta-radial" cx="25%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#9a3412" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="amber-radial" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Claude Accent Gradient -->
    <linearGradient id="claude-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <linearGradient id="terracotta-solid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <filter id="claude-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="675" fill="url(#claude-bg)"/>
  <rect width="1200" height="675" fill="url(#terracotta-radial)"/>
  <rect width="1200" height="675" fill="url(#amber-radial)"/>

  <!-- Elegant Architectural Lines -->
  <g opacity="0.1" stroke="#fb923c" stroke-width="1">
    <circle cx="950" cy="300" r="320" fill="none"/>
    <circle cx="950" cy="300" r="240" fill="none"/>
    <circle cx="950" cy="300" r="160" fill="none"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="135" x2="1200" y2="135"/>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 80)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="320" height="38" rx="19" fill="#292524" fill-opacity="0.85" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="6" fill="#fb923c"/>
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fdba74" letter-spacing="1.5">ANTHROPIC FRONTIER AI</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">Claude 3.7 Sonnet</text>
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#claude-grad)" letter-spacing="-0.5">&amp; Artifacts Masterclass</text>

    <!-- Subtitle description -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#a8a29e">
      <tspan x="0" dy="0">Master Hybrid Extended Thinking, Interactive Claude Artifacts, Computer</tspan>
      <tspan x="0" dy="26">Use, and 200K+ Context Window in all Indian regional languages &amp; English.</tspan>
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 290)">
      <!-- Badge 1: Extended Thinking -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="#1c1917" stroke="#ea580c" stroke-width="1.2"/>
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fb923c">🧠 Hybrid Thinking</text>
      </g>
      <!-- Badge 2: Artifacts -->
      <g transform="translate(195, 0)">
        <rect width="175" height="42" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">✨ Claude Artifacts</text>
      </g>
      <!-- Badge 3: 200K Context -->
      <g transform="translate(385, 0)">
        <rect width="155" height="42" rx="10" fill="#1c1917" stroke="#fb923c" stroke-width="1.2"/>
        <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fed7aa">📚 200K Context</text>
      </g>
    </g>

    <!-- Bottom Highlights -->
    <g transform="translate(0, 375)">
      <circle cx="10" cy="10" r="4" fill="#fb923c"/>
      <text x="24" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#d6d3d1">All Indian Languages (Malayalam, Hindi, Tamil...) + English</text>
      
      <circle cx="430" cy="10" r="4" fill="#fb923c"/>
      <text x="444" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#d6d3d1">Official Certificate Included</text>
    </g>
  </g>

  <!-- Right Visual: Claude Starburst & Interactive Artifact Window -->
  <g transform="translate(730, 80)">
    <!-- Ambient Star Glow -->
    <circle cx="210" cy="120" r="120" fill="#ea580c" opacity="0.2" filter="url(#claude-glow)"/>

    <!-- Anthropic Iconic Starburst Glyph -->
    <g transform="translate(210, 110) scale(1.4)">
      <!-- 8-pointed geometric rays -->
      <rect x="-6" y="-55" width="12" height="110" rx="6" fill="url(#claude-grad)"/>
      <rect x="-55" y="-6" width="110" height="12" rx="6" fill="url(#claude-grad)"/>
      <rect x="-6" y="-55" width="12" height="110" rx="6" fill="url(#claude-grad)" transform="rotate(45)"/>
      <rect x="-6" y="-55" width="12" height="110" rx="6" fill="url(#claude-grad)" transform="rotate(-45)"/>
      <circle cx="0" cy="0" r="16" fill="#fff7ed"/>
    </g>

    <!-- Interactive Claude Artifact Window Mockup -->
    <g transform="translate(10, 240)" filter="url(#claude-glow)">
      <!-- Card Container -->
      <rect width="420" height="260" rx="16" fill="#141211" stroke="#ea580c" stroke-width="1.8" stroke-opacity="0.75"/>
      <!-- Header -->
      <rect width="420" height="38" rx="16" fill="#292524" fill-opacity="0.95"/>
      <circle cx="22" cy="19" r="5" fill="#ef4444"/>
      <circle cx="38" cy="19" r="5" fill="#eab308"/>
      <circle cx="54" cy="19" r="5" fill="#22c55e"/>
      <text x="75" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fed7aa">Claude Artifact: InteractiveDashboard.tsx</text>
      
      <!-- Preview / Code toggle button -->
      <rect x="330" y="9" width="76" height="20" rx="10" fill="#ea580c"/>
      <text x="345" y="23" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff">PREVIEW</text>

      <!-- Artifact Inner Body: Interactive Chart & Thinking Token Counter -->
      <g transform="translate(20, 52)">
        <!-- Thinking mode badge -->
        <rect width="380" height="32" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#fb923c"/>
        <text x="28" y="20" font-family="monospace" font-size="11" fill="#fde68a">Thinking: 4,096 tokens reasoning deep...</text>
        <text x="325" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">✓ READY</text>

        <!-- Simulated Interactive Chart & Widget -->
        <g transform="translate(0, 44)">
          <rect width="380" height="145" rx="10" fill="#1f1d1b" stroke="#44403c" stroke-width="1"/>
          
          <!-- Mini Bar Chart -->
          <rect x="25" y="95" width="30" height="35" rx="4" fill="#ea580c"/>
          <rect x="75" y="70" width="30" height="60" rx="4" fill="#f97316"/>
          <rect x="125" y="45" width="30" height="85" rx="4" fill="#fb923c"/>
          <rect x="175" y="25" width="30" height="105" rx="4" fill="#f59e0b"/>
          <rect x="225" y="15" width="30" height="115" rx="4" fill="#facc15"/>

          <!-- Interactive Control Slider / Switch -->
          <g transform="translate(275, 30)">
            <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#d6d3d1">REACT 18 CODE</text>
            <rect x="0" y="10" width="85" height="18" rx="9" fill="#0c0a09" stroke="#ea580c" stroke-width="1"/>
            <circle cx="12" cy="19" r="6" fill="#ea580c"/>
            <text x="24" y="23" font-family="monospace" font-size="9" fill="#fed7aa">Live Render</text>

            <rect x="0" y="38" width="85" height="22" rx="6" fill="#ea580c"/>
            <text x="14" y="53" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff">EXPORT APP</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="667" width="1200" height="8" fill="url(#claude-grad)"/>
</svg>
