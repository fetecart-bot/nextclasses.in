<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="gemini-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0b112c"/>
      <stop offset="100%" stop-color="#070918"/>
    </linearGradient>

    <!-- Glowing Radial Centers -->
    <radialGradient id="gemini-glow-blue" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gemini-glow-purple" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gemini-glow-cyan" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Star & Logo Gradients -->
    <linearGradient id="gemini-star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="gemini-badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="675" fill="url(#gemini-bg)"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="675" fill="url(#gemini-glow-blue)"/>
  <rect width="1200" height="675" fill="url(#gemini-glow-purple)"/>
  <rect width="1200" height="675" fill="url(#gemini-glow-cyan)"/>

  <!-- Subtle Cyber Constellation Grid Lines -->
  <g opacity="0.15" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4 8">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- Left Side: Brand & Hero Typography -->
  <g transform="translate(80, 80)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="6" fill="#60a5fa"/>
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="1.5">GOOGLE DEEPMIND AI PLATFORM</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">Google AI Studio</text>
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#gemini-star-grad)" letter-spacing="-0.5">&amp; Gemini 2.0 Flash</text>

    <!-- Subtitle description -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      <tspan x="0" dy="0">Production Multimodal Web Apps, Structured JSON Schemas &amp;</tspan>
      <tspan x="0" dy="26">Autonomous Function Calling with the Official @google/genai SDK</tspan>
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 290)">
      <!-- Badge 1: Multimodal -->
      <g transform="translate(0, 0)">
        <rect width="165" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
        <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">🎥 Video &amp; Vision 4K</text>
      </g>
      <!-- Badge 2: 1M+ Context -->
      <g transform="translate(180, 0)">
        <rect width="160" height="42" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5"/>
        <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c084fc">⚡ 1M+ Tokens Free</text>
      </g>
      <!-- Badge 3: Function Calling -->
      <g transform="translate(355, 0)">
        <rect width="175" height="42" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.5"/>
        <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">🛠️ Function Calling</text>
      </g>
    </g>

    <!-- Bottom Highlights -->
    <g transform="translate(0, 375)">
      <circle cx="10" cy="10" r="4" fill="#22c55e"/>
      <text x="24" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">Bilingual Malayalam &amp; English</text>
      
      <circle cx="260" cy="10" r="4" fill="#22c55e"/>
      <text x="274" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">Live Web App Project Deployments</text>
    </g>
  </g>

  <!-- Right Side: Glowing Gemini Star & Code Terminal Visual -->
  <g transform="translate(720, 70)">
    <!-- Outer Glow Behind Star -->
    <circle cx="230" cy="170" r="140" fill="#8b5cf6" opacity="0.25" filter="url(#glow-blur)"/>

    <!-- Large Iconic Gemini 4-Point Sparkle Star -->
    <g transform="translate(230, 170) scale(1.6)" filter="url(#neon-glow)">
      <!-- Smooth 4-point star curve -->
      <path d="M 0 -80 C 0 -20, 20 0, 80 0 C 20 0, 0 20, 0 80 C 0 20, -20 0, -80 0 C -20 0, 0 -20, 0 -80 Z" fill="url(#gemini-star-grad)"/>
      <circle cx="0" cy="0" r="14" fill="#ffffff"/>
      <circle cx="0" cy="0" r="24" fill="#60a5fa" opacity="0.6"/>
    </g>

    <!-- Floating Interactive Studio Code Terminal Card -->
    <g transform="translate(20, 280)" filter="url(#glow-blur)">
      <rect width="420" height="230" rx="16" fill="#070d1e" stroke="#3b82f6" stroke-width="1.8" stroke-opacity="0.8"/>
      <!-- Window Titlebar -->
      <rect width="420" height="38" rx="16" fill="#0f172a" fill-opacity="0.9"/>
      <circle cx="22" cy="19" r="5" fill="#ef4444"/>
      <circle cx="38" cy="19" r="5" fill="#eab308"/>
      <circle cx="54" cy="19" r="5" fill="#22c55e"/>
      <text x="75" y="24" font-family="monospace" font-size="12" fill="#94a3b8">gemini-2.0-flash-multimodal.ts</text>
      <rect x="330" y="10" width="75" height="18" rx="4" fill="#2563eb" fill-opacity="0.3"/>
      <text x="338" y="23" font-family="monospace" font-size="10" font-weight="700" fill="#60a5fa">API: 200 OK</text>

      <!-- Code lines -->
      <g transform="translate(22, 58)" font-family="monospace" font-size="12">
        <text y="15" fill="#60a5fa">import</text>
        <text x="50" y="15" fill="#e2e8f0">{ GoogleGenAI }</text>
        <text x="170" y="15" fill="#60a5fa">from</text>
        <text x="210" y="15" fill="#34d399">'@google/genai'</text>

        <text y="42" fill="#93c5fd">const</text>
        <text x="45" y="42" fill="#f8fafc">ai =</text>
        <text x="80" y="42" fill="#c084fc">new GoogleGenAI</text>
        <text x="195" y="42" fill="#cbd5e1">({</text>
        <text x="212" y="42" fill="#f59e0b">apiKey</text>
        <text x="260" y="42" fill="#cbd5e1">});</text>

        <text y="70" fill="#93c5fd">const</text>
        <text x="45" y="70" fill="#f8fafc">res =</text>
        <text x="90" y="70" fill="#60a5fa">await</text>
        <text x="135" y="70" fill="#f8fafc">ai.models.</text>
        <text x="210" y="70" fill="#f43f5e">generateContent</text>
        <text x="325" y="70" fill="#cbd5e1">({</text>

        <text x="16" y="96" fill="#38bdf8">model:</text>
        <text x="70" y="96" fill="#34d399">'gemini-2.0-flash'</text>
        <text x="200" y="96" fill="#94a3b8">/* 1M Context */</text>

        <text x="16" y="122" fill="#38bdf8">config:</text>
        <text x="70" y="122" fill="#cbd5e1">{ responseMimeType:</text>
        <text x="220" y="122" fill="#34d399">'application/json'</text>
        <text x="350" y="122" fill="#cbd5e1">}</text>

        <text y="148" fill="#cbd5e1">});</text>
      </g>
    </g>
  </g>

  <!-- Subtle bottom border brand strip -->
  <rect x="0" y="667" width="1200" height="8" fill="url(#gemini-badge-grad)"/>
</svg>
